

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YESI V4</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}

body{background:#eef2f7;padding:18px;color:#111827}

.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 8px 22px rgba(0,0,0,.08)}

.header{background:#111827;color:#fff}

h1{font-size:28px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}

.box{background:#f3f4f6;border-radius:12px;padding:12px}

.value{font-size:24px;font-weight:700;margin-top:4px}

label{font-size:13px;color:#6b7280}

input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px;font-size:16px}

button{width:100%;padding:13px;border:none;border-radius:12px;color:#fff;font-weight:700;margin-top:10px;font-size:16px}

.green{background:#16a34a}

.red{background:#dc2626}

.blue{background:#2563eb}

.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}

.small{font-size:12px;color:#6b7280}

.stockbar{height:8px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:8px}

.fill{height:100%;background:#22c55e}

.low{background:#ef4444}

.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}

.ok{background:#dcfce7;color:#166534}

.warn{background:#fee2e2;color:#991b1b}

</style>

</head>

<body>

<div class="card header">

<h1>YESI V4</h1>

<p>Zentrallager Zurndorf</p>

<div class="grid">

<div class="box">

<label>Gesamtumsatz</label>

<div class="value" id="umsatz">€ 1486.30</div>

</div>

<div class="box">

<label>Gewinn</label>

<div class="value" id="gewinn">€ 1401.80</div>

</div>

<div class="box">

<label>Bargeld</label>

<div class="value" id="cash">€ 420</div>

</div>

<div class="box">

<label>Ausgaben</label>

<div class="value" id="ausgaben">€ 84.50</div>

</div>

</div>

</div>

<div class="card">

<h2>Neue Ausgabe</h2>

<input id="name" placeholder="Artikel">

<input id="preis" type="number" step="0.01" placeholder="Betrag">

<button class="green" onclick="addExpense()">Ausgabe speichern</button>

</div>

<div class="card">

<h2>Lagerverwaltung</h2>

<select id="produkt">

<option value="0">Coca Cola 0,5L</option>

<option value="1">Red Bull</option>

<option value="2">Leberkäsesemmel</option>

</select>

<input id="menge" type="number" value="1" min="1">

<button class="blue" onclick="wareneingang()">Wareneingang +</button>

<button class="red" onclick="befuellen()">Automat befüllen −</button>

</div>

<div class="card">

<h2>Produkte</h2>

<div id="lager"></div>

</div>

<div class="card">

<h2>Ausgaben Historie</h2>

<div id="history"></div>

</div>

<script>

let umsatz=1486.30;

let bargeld=420;

let produkte=[

{name:"Coca Cola 0,5L",stock:18,min:10,buy:0.78,sell:2.00},

{name:"Red Bull",stock:6,min:10,buy:1.05,sell:2.50},

{name:"Leberkäsesemmel",stock:14,min:8,buy:2.10,sell:4.50}

];

let ausgaben=[

{name:"Coca Cola 24x",amount:18.90,date:"24.09.26"},

{name:"Red Bull",amount:31.20,date:"24.09.26"},

{name:"Ölz Linzer",amount:34.40,date:"23.09.26"}

];

function totalExpenses(){

return ausgaben.reduce((a,b)=>a+b.amount,0);

}

function profit(){

return (umsatz-totalExpenses()).toFixed(2);

}

function refresh(){

document.getElementById("umsatz").innerHTML="€ "+umsatz.toFixed(2);

document.getElementById("cash").innerHTML="€ "+bargeld;

document.getElementById("ausgaben").innerHTML="€ "+totalExpenses().toFixed(2);

document.getElementById("gewinn").innerHTML="€ "+profit();

let lager=document.getElementById("lager");

lager.innerHTML="";

produkte.forEach((p)=>{

let percent=Math.min(100,(p.stock/24)*100);

let color=p.stock<=p.min?"low":"fill";

let badge=p.stock<=p.min?'<span class="badge warn">Nachbestellen</span>':'<span class="badge ok">OK</span>';

lager.innerHTML+=`

<div class="item">

<div style="flex:1">

<b>${p.name}</b><br>

<span class="small">${p.stock} Stück · EK €${p.buy}</span>

<div class="stockbar"><div class="${color}" style="width:${percent}%"></div></div>

</div>

<div>${badge}</div>

</div>`;

});

let h=document.getElementById("history");

h.innerHTML="";

ausgaben.forEach(e=>{

h.innerHTML+=`

<div class="item">

<div>

<b>${e.name}</b><br>

<span class="small">${e.date}</span>

</div>

<div style="color:#dc2626;font-weight:bold">- € ${e.amount.toFixed(2)}</div>

</div>`;

});

}

function addExpense(){

let n=document.getElementById("name").value;

let p=parseFloat(document.getElementById("preis").value);

if(!n||!p)return;

let d=new Date();

let date=("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+String(d.getFullYear()).slice(-2);

ausgaben.unshift({name:n,amount:p,date});

document.getElementById("name").value="";

document.getElementById("preis").value="";

refresh();

}

function wareneingang(){

let id=document.getElementById("produkt").value;

let qty=parseInt(document.getElementById("menge").value);

produkte[id].stock+=qty;

refresh();

}

function befuellen(){

let id=document.getElementById("produkt").value;

let qty=parseInt(document.getElementById("menge").value);

produkte[id].stock=Math.max(0,produkte[id].stock-qty);

refresh();

}

refresh();

</script>

</body>

</html>
