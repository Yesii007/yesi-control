<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YESI Control V4.1</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}

body{background:#000;color:#fff;max-width:430px;margin:auto}

header{background:#c8a315;padding:18px}

header h1{color:#000;font-size:28px}

header p{color:#3d3100;font-weight:600}

.wrap{padding:14px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}

.card{background:#111;border-radius:14px;padding:12px}

.card small{color:#888}

.value{font-size:22px;font-weight:700;margin-top:4px}

.section{background:#111;border-radius:18px;padding:14px;margin-bottom:15px}

.section h2{font-size:18px;margin-bottom:10px}

input,select,textarea{

width:100%;background:#1f1f1f;border:none;color:#fff;

padding:12px;border-radius:10px;margin-top:8px

}

textarea{resize:none;height:70px}

.row{display:flex;gap:8px}

.btn{

width:100%;padding:13px;border:none;border-radius:12px;

font-weight:700;margin-top:10px;cursor:pointer

}

.gold{background:#c8a315;color:#000}

.red{background:#991b1b;color:#fff}

.green{background:#15803d;color:#fff}

.gray{background:#27272a;color:#fff}

.item{padding:10px 0;border-bottom:1px solid #222}

.top{display:flex;justify-content:space-between;align-items:center}

.badge{

background:#3a2f00;color:#ffd95a;padding:2px 8px;

border-radius:20px;font-size:11px

}

.storno{background:#7f1d1d;color:#fff}

.positive{color:#22c55e;font-weight:700}

.negative{color:#ef4444;font-weight:700}

.tabs{display:flex;gap:8px;margin-top:8px}

.tab{

flex:1;padding:10px;border-radius:10px;border:none;

background:#1f1f1f;color:#fff;font-weight:700

}

.active{background:#c8a315;color:#000}

</style>

</head>

<body>

<header>

<h1>YESI Control</h1>

<p>V4.1</p>

</header>

<div class="wrap">

<div class="grid">

<div class="card">

<small>Gesamtumsatz</small>

<div class="value" id="umsatz">€746.00</div>

</div>

<div class="card">

<small>Gesamtgewinn</small>

<div class="value" id="gewinn">€638.74</div>

</div>

<div class="card">

<small>Gesamtausgaben</small>

<div class="value" id="ausgaben">€107.26</div>

</div>

<div class="card">

<small>Bargeld</small>

<div class="value" id="cash">€638.74</div>

</div>

</div>

<div class="section">

<h2>Neue Automatenbuchung</h2>

<select id="automat">

<option>WA</option>

<option>WE</option>

<option>Bruck</option>

<option>Wien</option>

</select>

<input type="number" id="automatBetrag" placeholder="Betrag €">

<textarea id="automatNotiz" placeholder="Notiz"></textarea>

<button class="btn gold" onclick="addAutomat()">Speichern</button>

<button class="btn red" onclick="resetAutomat()">Automat auf 0 setzen</button>

</div>

<div class="section">

<h2>Firmen Ein- & Ausgaben</h2>

<div class="tabs">

<button id="expBtn" class="tab active" onclick="setMode('expense')">Ausgabe</button>

<button id="incBtn" class="tab" onclick="setMode('income')">Zubuchung</button>

</div>

<input type="number" id="firmaBetrag" placeholder="Betrag €">

<textarea id="firmaNotiz" placeholder="z.B. Metro Einkauf"></textarea>

<button class="btn green" onclick="addFirma()">Zur Kasse buchen</button>

</div>

<div class="section">

<h2>Verlauf</h2>

<div id="history"></div>

</div>

</div>

<script>

let mode="expense";

let data=JSON.parse(localStorage.getItem("yesi_v41"))||{

cash:638.74,

revenue:746,

expenses:107.26,

history:[

{id:1,type:"Firma",title:"Metro Einkauf",amount:-77.26,date:"25.09.26",storno:false},

{id:2,type:"WA",title:"Verkauf",amount:135.50,date:"25.09.26",storno:false},

{id:3,type:"WA",title:"Korrektur",amount:-30,date:"25.09.26",storno:false}

]};

function save(){

localStorage.setItem("yesi_v41",JSON.stringify(data));

render();

}

function render(){

document.getElementById("cash").innerText="€"+data.cash.toFixed(2);

document.getElementById("umsatz").innerText="€"+data.revenue.toFixed(2);

document.getElementById("ausgaben").innerText="€"+data.expenses.toFixed(2);

let profit=data.revenue-data.expenses;

document.getElementById("gewinn").innerText="€"+profit.toFixed(2);

const h=document.getElementById("history");

h.innerHTML="";

data.history.forEach(e=>{

let div=document.createElement("div");

div.className="item";

let badge=e.type==="Firma"

?'<span class="badge">Firma</span>'

:"";

let s=e.storno

?'<span class="badge storno">STORNIERT</span>'

:'<button class="btn gray" style="width:90px;padding:7px;margin:0" onclick="storno('+e.id+')">Storno</button>';

div.innerHTML=`

<div class="top">

<div>

<b>${e.title}</b> ${badge}<br>

<small>${e.date}</small>

</div>

<div style="text-align:right">

<div class="${e.amount>=0?'positive':'negative'}">

${e.amount>=0?'+':'-'} €${Math.abs(e.amount).toFixed(2)}

</div>

${s}

</div>

</div>`;

h.appendChild(div);

});

}

function setMode(m){

mode=m;

document.getElementById("expBtn").classList.remove("active");

document.getElementById("incBtn").classList.remove("active");

if(m==="expense")

document.getElementById("expBtn").classList.add("active");

else

document.getElementById("incBtn").classList.add("active");

}

function today(){

const d=new Date();

return String(d.getDate()).padStart(2,"0")+"."+

String(d.getMonth()+1).padStart(2,"0")+"."+

String(d.getFullYear()).slice(-2);

}

function addAutomat(){

let amount=parseFloat(document.getElementById("automatBetrag").value);

if(!amount)return;

let machine=document.getElementById("automat").value;

let note=document.getElementById("automatNotiz").value||"Verkauf";

data.cash+=amount;

data.revenue+=amount;

data.history.unshift({

id:Date.now(),

type:machine,

title:note,

amount:amount,

date:today(),

storno:false

});

document.getElementById("automatBetrag").value="";

document.getElementById("automatNotiz").value="";

save();

}

function addFirma(){

let amount=parseFloat(document.getElementById("firmaBetrag").value);

if(!amount)return;

let note=document.getElementById("firmaNotiz").value||

(mode==="expense"?"Ausgabe":"Zubuchung");

let signed=mode==="expense"?-amount:amount;

data.cash+=signed;

if(mode==="expense")

data.expenses+=amount;

data.history.unshift({

id:Date.now(),

type:"Firma",

title:note,

amount:signed,

date:today(),

storno:false

});

document.getElementById("firmaBetrag").value="";

document.getElementById("firmaNotiz").value="";

save();

}

function storno(id){

let e=data.history.find(x=>x.id===id);

if(!e||e.storno)return;

e.storno=true;

data.history.unshift({

id:Date.now(),

type:e.type,

title:"Storno "+e.title,

amount:-e.amount,

date:today(),

storno:false

});

data.cash-=e.amount;

if(e.type!=="Firma")

data.revenue-=e.amount;

if(e.type==="Firma"&&e.amount<0)

data.expenses+=e.amount;

save();

}

function resetAutomat(){

alert("Hier kommt später die Funktion 'Automat auf 0 setzen'.");

}

render();

</script>

</body>

</html>
