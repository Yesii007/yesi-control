

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YESI Control V2</title>

<style>

body{margin:0;background:#0f1115;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}

header{background:#d4af37;color:#111;padding:18px;font-size:24px;font-weight:bold}

.wrap{padding:16px;max-width:700px;margin:auto}

.card{background:#1a1d24;border-radius:14px;padding:14px;margin-bottom:14px}

h1,h2,h3,p{margin:6px 0}

input{width:100%;padding:12px;margin:6px 0;border:none;border-radius:10px;background:#2b303a;color:#fff}

button{width:100%;padding:12px;border:none;border-radius:10px;background:#d4af37;color:#111;font-weight:bold;font-size:16px}

.row{display:flex;gap:10px}

.row .box{flex:1;background:#2b303a;padding:10px;border-radius:10px;text-align:center}

.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}

small{color:#aaa}

</style>

</head>

<body>

<header>💰 YESI CONTROL V2 🔔</header>

<div class="wrap">

<div class="card">

<h3>Gesamtübersicht</h3>

<div class="row">

<div class="box">

<small>Einnahmen</small>

<h2 id="income">€0.00</h2>

</div>

<div class="box">

<small>Ausgaben</small>

<h2 id="expense">€0.00</h2>

</div>

</div>

<h1 id="profit">Gewinn: €0.00</h1>

</div>

<div class="card">

<h3>💰 Einnahme hinzufügen</h3>

<input id="iname" placeholder="Automat / Artikel">

<input id="ivalue" type="number" step="0.01" placeholder="Betrag €">

<button onclick="addIncome()">Einnahme speichern</button>

</div>

<div class="card">

<h3>🛒 Einkauf hinzufügen</h3>

<input id="sname" placeholder="Lieferant">

<input id="svalue" type="number" step="0.01" placeholder="Betrag €">

<button onclick="addExpense()">Einkauf speichern</button>

</div>

<div class="card">

<h3>📅 Dieser Monat</h3>

<div id="month"></div>

</div>

<div class="card">

<h3>📜 Letzte Buchungen</h3>

<div id="history"></div>

</div>

</div>

<script>

let db = JSON.parse(localStorage.getItem("yesiV2") || '{"income":[],"expense":[]}');

function save(){

localStorage.setItem("yesiV2", JSON.stringify(db));

render();

}

function addIncome(){

const n=document.getElementById("iname").value;

const v=parseFloat(document.getElementById("ivalue").value);

if(!n || !v) return;

db.income.unshift({name:n,value:v,date:new Date().toISOString()});

document.getElementById("iname").value="";

document.getElementById("ivalue").value="";

save();

}

function addExpense(){

const n=document.getElementById("sname").value;

const v=parseFloat(document.getElementById("svalue").value);

if(!n || !v) return;

db.expense.unshift({name:n,value:v,date:new Date().toISOString()});

document.getElementById("sname").value="";

document.getElementById("svalue").value="";

save();

}

function euro(x){

return "€"+x.toFixed(2);

}

function render(){

let income=db.income.reduce((a,b)=>a+b.value,0);

let expense=db.expense.reduce((a,b)=>a+b.value,0);

document.getElementById("income").innerHTML=euro(income);

document.getElementById("expense").innerHTML=euro(expense);

document.getElementById("profit").innerHTML="Gewinn: "+euro(income-expense);

const m=new Date().getMonth();

const y=new Date().getFullYear();

let mi=db.income.filter(x=>{

let d=new Date(x.date);

return d.getMonth()==m && d.getFullYear()==y;

}).reduce((a,b)=>a+b.value,0);

let me=db.expense.filter(x=>{

let d=new Date(x.date);

return d.getMonth()==m && d.getFullYear()==y;

}).reduce((a,b)=>a+b.value,0);

document.getElementById("month").innerHTML=

'<div class="item"><span>Einnahmen</span><b>'+euro(mi)+'</b></div>'+

'<div class="item"><span>Ausgaben</span><b>'+euro(me)+'</b></div>'+

'<div class="item"><span>Gewinn</span><b>'+euro(mi-me)+'</b></div>';

let all=[];

db.income.forEach(x=>all.push({icon:"💰",name:x.name,val:x.value,date:x.date}));

db.expense.forEach(x=>all.push({icon:"🛒",name:x.name,val:-x.value,date:x.date}));

all.sort((a,b)=>new Date(b.date)-new Date(a.date));

document.getElementById("history").innerHTML=

all.map(x=>

'<div class="item"><div><b>'+x.icon+' '+x.name+

'</b><br><small>'+new Date(x.date).toLocaleDateString("de-AT")+

'</small></div><b>'+(x.val>0?"+":"-")+euro(Math.abs(x.val))+'</b></div>'

).join("") || "Keine Buchungen";

}

render();

</script>

</body>

</html>
