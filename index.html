<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YESI Control V4.1</title>

<style>

body{

margin:0;

font-family:-apple-system,Arial;

background:#0b0b0b;

color:white;

}

.header{

background:#C8A227;

color:#111;

padding:20px;

font-size:24px;

font-weight:bold;

}

.wrap{padding:16px;}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

.card{

background:#1B1B1B;

border-radius:18px;

padding:16px;

}

.label{

font-size:12px;

color:#999;

}

.value{

font-size:28px;

font-weight:bold;

margin-top:6px;

}

input,select{

width:100%;

padding:12px;

border:none;

border-radius:12px;

background:#2A2A2A;

color:white;

margin-top:6px;

box-sizing:border-box;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#C8A227;

font-size:18px;

font-weight:bold;

margin-top:14px;

}

.item{

border-top:1px solid #333;

padding:10px 0;

}

.green{color:#5BE26B;font-weight:bold;}

small{color:#999;}

</style>

</head>

<body>

<div class="header">YESI Control</div>

<div class="wrap">

<div class="grid">

<div class="card">

<div class="label">Gesamtumsatz</div>

<div id="umsatz" class="value">€ 0,00</div>

</div>

<div class="card">

<div class="label">Gesamtgewinn</div>

<div id="gewinn" class="value">€ 0,00</div>

</div>

<div class="card">

<div class="label">Gesamtausgaben</div>

<div id="ausgaben" class="value">€ 0,00</div>

</div>

<div class="card">

<div class="label">Monatsumsatz</div>

<div id="monat" class="value">€ 0,00</div>

</div>

</div>

<br>

<div class="card">

<h2>Neue Entleerung</h2>

<div class="label">Standort</div>

<select id="firma">

<option>Zurndorf WA</option>

<option>Zurndorf WE</option>

<option>Bruck</option>

<option>Wien</option>

</select>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">

<div>

<div class="label">Münzen</div>

<input id="muenzen" type="number" value="0">

</div>

<div>

<div class="label">Scheine</div>

<input id="scheine" type="number" value="0">

</div>

</div>

<div class="label" style="margin-top:12px">Einkauf / Wareneinsatz</div>

<input id="einsatz" type="number" value="0">

<button onclick="speichern()">Speichern</button>

</div>

<br>

<div class="card">

<h2>Verlauf</h2>

<input id="suche" placeholder="Standort suchen..." oninput="anzeigen()">

<div id="liste"></div>

</div>

<br>

<div class="card">

<h2>Standortumsatz</h2>

<div class="item"><b>Zurndorf WA</b><div id="wa">€ 0,00</div></div>

<div class="item"><b>Zurndorf WE</b><div id="we">€ 0,00</div></div>

<div class="item"><b>Bruck</b><div id="bruck">€ 0,00</div></div>

<div class="item"><b>Wien</b><div id="wien">€ 0,00</div></div>

</div>

</div>

<script>

let daten = JSON.parse(localStorage.getItem("yesi") || "[]");

function euro(v){

return new Intl.NumberFormat("de-AT",{

style:"currency",

currency:"EUR"

}).format(v);

}

function speichern(){

const firma=document.getElementById("firma").value;

const muenzen=Number(document.getElementById("muenzen").value)||0;

const scheine=Number(document.getElementById("scheine").value)||0;

const einsatz=Number(document.getElementById("einsatz").value)||0;

const umsatz=muenzen+scheine;

const profit=umsatz-einsatz;

daten.unshift({

firma,

muenzen,

scheine,

einsatz,

umsatz,

profit,

datum:new Date().toISOString()

});

localStorage.setItem("yesi",JSON.stringify(daten));

document.getElementById("muenzen").value=0;

document.getElementById("scheine").value=0;

document.getElementById("einsatz").value=0;

anzeigen();

}

function loeschen(i){

daten.splice(i,1);

localStorage.setItem("yesi",JSON.stringify(daten));

anzeigen();

}

function anzeigen(){

let gesamt=0;

let gewinn=0;

let ausgaben=0;

let monat=0;

let standorte={

"Zurndorf WA":0,

"Zurndorf WE":0,

"Bruck":0,

"Wien":0

};

const filter=document.getElementById("suche").value.toLowerCase();

const liste=document.getElementById("liste");

liste.innerHTML="";

const aktuellerMonat=new Date().getMonth();

daten.forEach((x,i)=>{

const d=new Date(x.datum);

gesamt+=x.umsatz;

gewinn+=x.profit;

ausgaben+=x.einsatz;

if(d.getMonth()==aktuellerMonat){

monat+=x.umsatz;

}

standorte[x.firma]+=x.umsatz;

if(x.firma.toLowerCase().includes(filter)){

liste.innerHTML+=`

<div class="item">

<b>${x.firma}</b><br>

<small>${d.toLocaleDateString("de-AT")}</small><br><br>

Umsatz: ${euro(x.umsatz)}<br>

<span class="green">Gewinn: ${euro(x.profit)}</span><br>

Ausgaben: ${euro(x.einsatz)}<br>

<button onclick="loeschen(${i})">Löschen</button>

</div>

`;

}

});

document.getElementById("umsatz").innerText=euro(gesamt);

document.getElementById("gewinn").innerText=euro(gewinn);

document.getElementById("ausgaben").innerText=euro(ausgaben);

document.getElementById("monat").innerText=euro(monat);

document.getElementById("wa").innerText=euro(standorte["Zurndorf WA"]);

document.getElementById("we").innerText=euro(standorte["Zurndorf WE"]);

document.getElementById("bruck").innerText=euro(standorte["Bruck"]);

document.getElementById("wien").innerText=euro(standorte["Wien"]);

}

anzeigen();

</script>

</body>

</html>
