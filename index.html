<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>YESI Control V3</title>

<style>

body{

  margin:0;

  background:#0b0b0b;

  color:#fff;

  font-family:-apple-system,Arial;

}

header{

  background:#c89b2b;

  color:#111;

  font-size:24px;

  font-weight:700;

  padding:18px;

}

.wrap{padding:16px;}

.grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

}

.card{

  background:#1b1b1b;

  border-radius:18px;

  padding:16px;

}

.label{color:#aaa;font-size:13px;}

.big{font-size:22px;font-weight:bold;margin-top:6px;}

h2{margin-top:0}

select,input{

  width:100%;

  padding:12px;

  margin-top:6px;

  margin-bottom:12px;

  background:#2a2a2a;

  color:#fff;

  border:none;

  border-radius:12px;

  box-sizing:border-box;

}

.row{display:flex;gap:10px;}

button{

  width:100%;

  padding:14px;

  background:#c89b2b;

  color:#111;

  border:none;

  border-radius:14px;

  font-size:18px;

  font-weight:bold;

}

.item{

  background:#262626;

  border-radius:12px;

  padding:10px;

  margin-top:8px;

}

small{color:#bbb}

</style>

</head>

<body>

<header>YESI Control</header>

<div class="wrap">

<div class="grid">

<div class="card">

<div class="label">Gesamtumsatz</div>

<div class="big" id="umsatz">€ 0,00</div>

</div>

<div class="card">

<div class="label">Gesamtgewinn</div>

<div class="big" id="gewinn">€ 0,00</div>

</div>

<div class="card">

<div class="label">Heute</div>

<div class="big" id="heute">€ 0,00</div>

</div>

<div class="card">

<div class="label">Monat</div>

<div class="big" id="monat">€ 0,00</div>

</div>

</div>

<br>

<div class="card">

<h2>Neue Entleerung</h2>

<select id="firma">

<option>Zurndorf WA</option>

<option>Zurndorf WE</option>

<option>Bruck</option>

<option>Wien</option>

</select>

<div class="row">

<div>

<div class="label">Münzen</div>

<input id="muenzen" type="number" value="0">

</div>

<div>

<div class="label">Scheine</div>

<input id="scheine" type="number" value="0">

</div>

</div>

<div class="label">Wareneinsatz</div>

<input id="einsatz" type="number" value="0">

<button onclick="speichern()">Speichern</button>

</div>

<br>

<div class="card">

<h2>Verlauf</h2>

<input id="suche" placeholder="Standort suchen..." oninput="anzeigen()">

<div id="liste"></div>

</div>

</div>

<script>

let daten = JSON.parse(localStorage.getItem("yesi_v3") || "[]");

function euro(v){

 return new Intl.NumberFormat("de-AT",{

 style:"currency",

 currency:"EUR"

 }).format(v);

}

function speichern(){

 const eintrag={

 firma:firma.value,

 muenzen:Number(muenzen.value),

 scheine:Number(scheine.value),

 einsatz:Number(einsatz.value),

 datum:new Date().toISOString()

 };

 daten.unshift(eintrag);

 localStorage.setItem("yesi_v3",JSON.stringify(daten));

 muenzen.value=0;

 scheine.value=0;

 einsatz.value=0;

 anzeigen();

}

function anzeigen(){

 let umsatz=0;

 let gewinn=0;

 let heute=0;

 let monat=0;

 const heuteTxt=new Date().toDateString();

 const monatTxt=new Date().toISOString().slice(0,7);

 liste.innerHTML="";

 daten.forEach(x=>{

 const einnahme=x.muenzen+x.scheine;

 const profit=einnahme-x.einsatz;

 umsatz+=einnahme;

 gewinn+=profit;

 const d=new Date(x.datum);

 if(d.toDateString()==heuteTxt) heute+=einnahme;

 if(x.datum.slice(0,7)==monatTxt) monat+=einnahme;

 if(x.firma.toLowerCase().includes(suche.value.toLowerCase())){

 liste.innerHTML+=`

 <div class="item">

 <b>${x.firma}</b><br>

 <small>${d.toLocaleDateString("de-AT")}</small><br><br>

 Umsatz: ${euro(einnahme)}<br>

 Gewinn: ${euro(profit)}

 </div>`;

 }

 });

 document.getElementById("umsatz").innerText=euro(umsatz);

 document.getElementById("gewinn").innerText=euro(gewinn);

 document.getElementById("heute").innerText=euro(heute);

 document.getElementById("monat").innerText=euro(monat);

}

anzeigen();

</script>

</body>

</html>
